name: YouTube Smart Shorts Automator (Node.js)

on:
  schedule:
    - cron: '0 0 * * 0' 
  workflow_dispatch: # لتشغيله يدوياً بضغطة زر

jobs:
  process_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install FFmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Node.js Dependencies
        run: npm install googleapis

      - name: Decode Cookies File Safely (Base64)
        run: |
          echo "${{ secrets.YT_COOKIES }}" | base64 --decode > cookies.txt

      - name: Run Magic Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: node process_and_upload.js
